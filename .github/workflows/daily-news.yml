name: Daily AI news
on:
  schedule:
    - cron: "17 */8 * * *"   # three times a day (UTC) so a missed run never loses a day
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-news
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-news.mjs
      - name: Commit new headlines
        run: |
          git config user.name "ai-roadway-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news
          git diff --cached --quiet || git commit -m "Daily AI news $(date -u +%F)"
          git push
